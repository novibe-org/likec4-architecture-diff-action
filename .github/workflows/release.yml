name: release

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: write

concurrency: release

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Release what main gained since the last version, and move the major tag to it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || echo v0.0.0)
          range=$([ "$last" = v0.0.0 ] && echo HEAD || echo "$last..HEAD")
          subjects=$(git log --no-merges --format=%s "$range")
          bodies=$(git log --no-merges --format=%b "$range")
          if printf '%s\n' "$subjects" | grep -qE '^[a-z]+(\([^)]*\))?!:' || printf '%s\n' "$bodies" | grep -q '^BREAKING CHANGE:'; then
            bump=major
          elif printf '%s\n' "$subjects" | grep -qE '^feat(\([^)]*\))?:'; then
            bump=minor
          elif printf '%s\n' "$subjects" | grep -qE '^(fix|perf)(\([^)]*\))?:'; then
            bump=patch
          else
            echo "Nothing to release since $last"
            exit 0
          fi
          IFS=. read -r major minor patch <<<"${last#v}"
          case $bump in
            major) tag=v$((major + 1)).0.0 ;;
            minor) tag=v$major.$((minor + 1)).0 ;;
            patch) tag=v$major.$minor.$((patch + 1)) ;;
          esac
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes
          git tag -f "${tag%%.*}" "$GITHUB_SHA"
          git push -f origin "refs/tags/${tag%%.*}"

  major-tag:
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Move the major tag to this release
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          git tag -f "${TAG%%.*}" HEAD
          git push -f origin "refs/tags/${TAG%%.*}"
