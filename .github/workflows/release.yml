name: release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  major-tag:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Move the major tag to this release
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          git tag -f "${TAG%%.*}" HEAD
          git push -f origin "refs/tags/${TAG%%.*}"
